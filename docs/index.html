<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>arXiv hep-th brief</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
<div class="max-w-3xl mx-auto p-4 sm:p-8">
  <header class="mb-6">
    <h1 class="text-2xl sm:text-3xl font-bold">hep-th daily brief</h1>
    <p class="text-sm text-slate-500 mt-1" id="meta">Loading…</p>
  </header>

  <section id="digest" class="hidden bg-white border rounded-lg p-4 mb-6 shadow-sm"></section>
  <div class="flex flex-wrap gap-3 mb-6 items-center">
    <select id="dateSelect" class="border rounded px-3 py-2 bg-white"></select>
    <div class="flex gap-1 bg-white border rounded p-1">
      <button data-view="personalized" class="view-btn px-3 py-1 rounded text-sm">Personalized</button>
      <button data-view="hepth" class="view-btn px-3 py-1 rounded text-sm">hep-th only</button>
      <button data-view="all" class="view-btn px-3 py-1 rounded text-sm">All (incl. cross)</button>
    </div>
  </div>

  <div id="papers" class="space-y-4"></div>
</div>

<script>
const REPO = "threers9/arxiv-brief"; // <-- edit this
const DATA = `https://raw.githubusercontent.com/${REPO}/main/data`;
let currentView = "personalized";
let currentData = null;

async function loadIndex() {
  const idx = await fetch(`${DATA}/index.json`).then(r => r.json());
  const sel = document.getElementById("dateSelect");
  sel.innerHTML = idx.dates.map(d => `<option value="${d}">${d}</option>`).join("");
  sel.addEventListener("change", e => loadDate(e.target.value));
  if (idx.dates.length) loadDate(idx.dates[0]);
}

async function loadDate(date) {
  currentData = await fetch(`${DATA}/${date}.json`).then(r => r.json());
  document.getElementById("meta").textContent =
    `${currentData.papers.length} papers · ${date} · keywords: ${currentData.keywords_used.join(", ")}`;
  const digestEl = document.getElementById("digest");
  if (currentData.digest) {
    digestEl.innerHTML = `<h2 class="text-sm font-semibold uppercase tracking-wide text-slate-500 mb-2">Today's digest</h2><p class="text-sm leading-relaxed">${currentData.digest}</p>`;
    digestEl.classList.remove("hidden");
  } else {
    digestEl.classList.add("hidden");
  }
  render();
}

function render() {
  let papers = [...currentData.papers];
  if (currentView === "personalized") {
    papers.sort((a, b) => b.relevance_score - a.relevance_score);
  } else if (currentView === "hepth") {
    papers = papers.filter(p => p.primary_category === "hep-th");
    papers.sort((a, b) => a.published < b.published ? 1 : -1);
  } else {
    papers.sort((a, b) => a.published < b.published ? 1 : -1);
  }

  document.getElementById("papers").innerHTML = papers.map(p => `
    <article class="bg-white border rounded-lg p-4 shadow-sm">
      <div class="flex items-start justify-between gap-3 mb-2">
        <a href="${p.url}" target="_blank" class="font-semibold text-blue-700 hover:underline leading-snug">${p.title}</a>
        ${p.relevance_score > 0 ? `<span class="shrink-0 text-xs bg-slate-100 rounded px-2 py-1">score ${p.relevance_score}</span>` : ""}
      </div>
      <p class="text-xs text-slate-500 mb-2">${p.authors} · ${p.primary_category}${p.categories.length > 1 ? " (+" + (p.categories.length - 1) + ")" : ""}</p>
      <p class="text-sm mb-2">${p.summary}</p>
      ${p.matched_interests.length ? `<p class="text-xs text-emerald-700">matched: ${p.matched_interests.join(", ")}</p>` : ""}
      <a href="${p.pdf_url}" target="_blank" class="text-xs text-slate-500 hover:underline">PDF ↗</a>
    </article>
  `).join("");

  document.querySelectorAll(".view-btn").forEach(b => {
    b.classList.toggle("bg-slate-900", b.dataset.view === currentView);
    b.classList.toggle("text-white", b.dataset.view === currentView);
  });
}

document.querySelectorAll(".view-btn").forEach(b => {
  b.addEventListener("click", () => { currentView = b.dataset.view; render(); });
});

loadIndex();
</script>
</body>
</html>
